name: Android ARM64 port probe

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android-arm64.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  android-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libclang-dev clang
      - name: Configure Android NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android35 --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
      - name: Install Rust target
        run: rustup target add "$TARGET"
      - name: Probe Android compatibility (capture errors)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p port-reports
          cargo check --locked --target "$TARGET" -p honk-core --no-default-features --features clash-api 2>&1 | tee port-reports/android-check.log
      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-port-report
          path: port-reports/
          if-no-files-found: warn
